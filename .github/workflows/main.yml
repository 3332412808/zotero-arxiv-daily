name: Send emails weekly
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 0'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          python - <<'PY'
from pathlib import Path
import os
import sys

sys.path.insert(0, str(Path("src").resolve()))
from zotero_arxiv_daily.config_override import apply_custom_config_override

applied, message = apply_custom_config_override(
    os.environ.get("CUSTOM_CONFIG"),
    Path("config/custom.yaml"),
)
if not applied:
    print(f"::warning::{message}")
PY
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py
